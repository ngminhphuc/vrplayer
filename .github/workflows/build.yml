name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "devin/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-32 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Assemble Quest debug APK
        run: ./gradlew :app:assembleQuestDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-quest-debug-${{ github.sha }}
          path: app/build/outputs/apk/quest/debug/app-quest-debug.apk
          if-no-files-found: error
          retention-days: 14
